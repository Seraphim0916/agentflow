name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # 測試檔和上層 agfnow/agentflow-v8 保持一字不差；這個分叉自己的排除只寫在這裡（AGF-V8-SYNC 2026-10-25）。
  # ENV_SKIPS：在 ubuntu CI 缺本機前提（macOS PTY、host 執行期標記、發布鏡像沒有的來源檔）而跑不起來的測試，兩個 job 都不跑。
  ENV_SKIPS: |
  # KNOWN_FAILURES：上層 0bda431 在 CI 也會失敗、與環境無關的測試；test job 排除，known-failures job 只跑這些。
  KNOWN_FAILURES: |
  TEST_FILES: "*.test.js"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/agentflow/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --version
      - name: node --test (known failures excluded)
        run: |
          args=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] && args+=(--test-skip-pattern "$pattern")
          done <<< "$ENV_SKIPS$KNOWN_FAILURES"
          node --test "${args[@]}" $TEST_FILES

  known-failures:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: skills/agentflow/scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node --version
      - name: node --test (known failures only)
        run: |
          args=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] && args+=(--test-name-pattern "$pattern")
          done <<< "$KNOWN_FAILURES"
          [ ${#args[@]} -gt 0 ] || { echo "no known failures"; exit 0; }
          node --test "${args[@]}" $TEST_FILES
